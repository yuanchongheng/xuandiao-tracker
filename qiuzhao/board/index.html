<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 秋招投递看板</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17212b;--muted:#66727e;--line:#dfe5ea;--blue:#102a43;--teal:#126e75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1650px;margin:auto;padding:20px 16px 50px}.hero{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 12px 32px rgba(16,42,67,.15)}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;opacity:.84;line-height:1.6}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:9px;margin-top:17px}.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.85}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.toolbar input,.toolbar select,.toolbar button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.toolbar input{min-width:260px;flex:1}.toolbar button{cursor:pointer;font-weight:750}.toolbar button.active{background:#18212b;color:#fff;border-color:#18212b}.notice{background:#fff8e8;border:1px solid #eedcae;color:#66501f;padding:11px 13px;border-radius:12px;margin-bottom:14px;font-size:13px;line-height:1.55}.board{display:grid;grid-template-columns:repeat(6,minmax(300px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}.column{background:#eef2f4;border:1px solid #e0e6ea;border-radius:16px;min-height:220px;overflow:hidden}.column-head{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;background:#f7f9fa;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.column-title{font-weight:850}.column-count{background:#e2e8ec;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:850}.org-groups{padding:9px;display:grid;gap:11px}.org-group{border:1px solid #dbe3e8;border-radius:14px;overflow:hidden;background:#f8fafb}.org-group.core{border-color:#8bb9ad}.org-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 10px;background:#e9eef2;border-bottom:1px solid #dce4e8}.org-group.core .org-head{background:#eaf5f1}.org-name{font-size:13px;font-weight:900;line-height:1.35}.org-count{font-size:10px;font-weight:850;color:#61717e;background:#fff;border:1px solid #dbe2e7;border-radius:999px;padding:2px 7px;white-space:nowrap}.org-jobs{padding:7px;display:grid;gap:7px}.job-card{background:#fff;border:1px solid #e2e7ea;border-radius:11px;padding:10px;box-shadow:0 2px 9px rgba(16,24,40,.035)}.job-card.core{box-shadow:inset 3px 0 #327f6f}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.role{font-weight:800;font-size:13px;line-height:1.45}.tag{font-size:9px;font-weight:850;border-radius:999px;padding:3px 6px;background:#edf1f4;color:#586773;white-space:nowrap}.tag.custom{background:#f1ebff;color:#6848a0}.meta{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}.next{margin-top:7px;padding:6px 8px;border-radius:8px;background:#fff6df;color:#7b5b17;font-size:11px;font-weight:750}.note{margin-top:7px;padding:7px 8px;border-radius:8px;background:#f7f9fa;color:#53616d;font-size:11px;line-height:1.45;white-space:pre-wrap}.actions{display:flex;gap:6px;margin-top:9px}.actions select,.actions button{font:inherit;font-size:11px;border:1px solid #dbe2e7;border-radius:8px;padding:6px 7px;background:#fff}.actions select{min-width:0;flex:1;font-weight:750}.actions button{cursor:pointer;font-weight:800}.empty{padding:22px 10px;text-align:center;color:#8a959e;font-size:12px}.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;padding:16px;z-index:999}.modal{background:#fff;width:min(650px,96vw);max-height:92vh;overflow:auto;border-radius:17px;padding:19px;box-shadow:0 24px 70px rgba(15,23,42,.3)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.modal h2{margin:0;font-size:20px}.modal-sub{margin:5px 0 0;color:var(--muted);font-size:12px}.close{border:0;background:#f0f3f5;border-radius:8px;padding:7px 9px;cursor:pointer}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:15px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#465563}.field input,.field select,.field textarea{width:100%;border:1px solid #d9e0e5;border-radius:9px;padding:9px 10px;font:inherit}.field textarea{min-height:94px;resize:vertical}.history{display:grid;gap:6px}.hist{display:flex;justify-content:space-between;gap:10px;border:1px solid #e7ecf0;border-radius:8px;padding:7px 9px;font-size:12px}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:13px;border-top:1px solid #e8edf1}.modal-actions div{display:flex;gap:7px}.modal-actions button{border:1px solid #d9e0e5;background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.modal-actions .save{background:#18212b;color:#fff;border-color:#18212b}.modal-actions .danger{color:#a6362f}.footer{color:var(--muted);font-size:12px;line-height:1.65;margin-top:13px}@media(max-width:850px){.wrap{padding:10px 8px 36px}.hero{border-radius:15px;padding:17px}.hero-top{flex-direction:column}.hero h1{font-size:23px}.nav{justify-content:flex-start}.stats{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(6,300px)}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<div class="hero-top"><div><h1>2027 秋招投递看板</h1><p>同一招聘阶段内按机构归组；机构名只显示一次，下面集中管理该机构的不同岗位。</p></div><div class="nav"><a href="../">投递总表</a><a href="../plus/">智能岗位池</a></div></div>
<div class="stats"><div class="stat"><b id="sWait">0</b><span>待投</span></div><div class="stat"><b id="sSent">0</b><span>已投</span></div><div class="stat"><b id="sTest">0</b><span>测评 / 笔试</span></div><div class="stat"><b id="sInterview">0</b><span>面试 / 体检</span></div><div class="stat"><b id="sOffer">0</b><span>Offer</span></div><div class="stat"><b id="sClosed">0</b><span>已结束</span></div></div>
</section>
<div class="toolbar"><input id="search" placeholder="搜索机构、地区、岗位、备注"><select id="typeFilter"><option value="all">全部类型</option><option value="国央企">国央企</option><option value="银行">银行</option><option value="其他">其他</option></select><button id="coreBtn">只看核心</button><button id="nextBtn">7天内有节点</button></div>
<div class="notice">同一机构的多个岗位现在会集中显示。不同岗位如果已经走到不同招聘阶段，仍分别出现在对应阶段列中，避免把流程状态混在一起。</div>
<div id="board" class="board"></div>
<div class="footer">“已结束”包含未通过、主动放弃和流程结束。你手动修改过的机构、岗位和实际投递地区会继续使用修改后的版本。</div>
</div>
<script src="../data.js"></script>
<script src="../data_additions_20261006.js"></script>
<script src="../user_jobs.js"></script>
<script>
const APP_KEY='qiuzhao-application-records-v1',LEGACY_KEY='autumn-2027-all-jobs-v3';
const STATUSES=['待投','已投','测评','笔试','面试','体检','Offer','未通过','主动放弃','流程结束'];
const GROUPS=[{id:'wait',title:'待投',statuses:['待投']},{id:'sent',title:'已投',statuses:['已投']},{id:'test',title:'测评 / 笔试',statuses:['测评','笔试']},{id:'interview',title:'面试 / 体检',statuses:['面试','体检']},{id:'offer',title:'Offer',statuses:['Offer']},{id:'closed',title:'已结束',statuses:['未通过','主动放弃','流程结束']}];
const base=window.JOBS||[],adds=window.JOB_ADDITIONS||[],map=new Map(base.map(j=>[j.id,{...j}]));
adds.forEach(a=>{if(a.hidden){map.delete(a.id);return}map.set(a.id,{...(map.get(a.id)||{}),...a})});
let jobs=QIUZHAO_USER_JOBS.apply([...map.values()]),query='',type='all',coreOnly=false,nextOnly=false;
function safe(key,fallback){try{const x=JSON.parse(localStorage.getItem(key)||'null');return x??fallback}catch{return fallback}}
function apps(){const x=safe(APP_KEY,{version:1,records:{}});return x&&x.records?x:{version:1,records:{}}}
function legacy(){const x=safe(LEGACY_KEY,{});return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
function today(){const d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${d.getFullYear()}-${m}-${day}`}
function getRec(id){const a=apps().records[id];if(a)return {...{status:'待投',appliedAt:'',latestAt:'',nextAt:'',note:'',history:[]},...a};if(legacy()[id])return {status:'已投',appliedAt:'',latestAt:'',nextAt:'',note:'',history:[{status:'已投',at:'',source:'旧版已投记录'}]};return {status:'待投',appliedAt:'',latestAt:'',nextAt:'',note:'',history:[]}}
function setRec(id,next){const store=apps(),old=getRec(id),status=next.status||'待投',changed=status!==old.status;const rec={status,appliedAt:next.appliedAt||'',latestAt:next.latestAt||'',nextAt:next.nextAt||'',note:next.note||'',history:Array.isArray(old.history)?old.history.slice():[]};if(changed){const d=today();if(status!=='待投'&&!rec.appliedAt)rec.appliedAt=d;if(!rec.latestAt)rec.latestAt=d;rec.history.unshift({status,at:d});rec.history=rec.history.slice(0,30)}store.records[id]=rec;localStorage.setItem(APP_KEY,JSON.stringify(store));const l=legacy();l[id]=status!=='待投';localStorage.setItem(LEGACY_KEY,JSON.stringify(l));return rec}
function clearRec(id){const store=apps();store.records[id]={status:'待投',appliedAt:'',latestAt:'',nextAt:'',note:'',history:[]};localStorage.setItem(APP_KEY,JSON.stringify(store));const l=legacy();l[id]=false;localStorage.setItem(LEGACY_KEY,JSON.stringify(l))}
function migrateLegacy(){const store=apps(),l=legacy();let changed=false;jobs.forEach(j=>{if(!store.records[j.id]&&l[j.id]){store.records[j.id]={status:'已投',appliedAt:'',latestAt:'',nextAt:'',note:'',history:[{status:'已投',at:'',source:'旧版已投记录'}]};changed=true}});if(changed)localStorage.setItem(APP_KEY,JSON.stringify(store))}
function parseDate(v){if(!v)return Infinity;const t=new Date(v+'T23:59:59').getTime();return Number.isFinite(t)?t:Infinity}
function deadlineValue(s){s=String(s||'');let m=s.match(/^(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],23,59,59).getTime();m=s.match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})/);if(m){const mo=+m[1],yr=mo>=8?2026:2027;return new Date(yr,mo-1,+m[2],23,59,59).getTime()}return Infinity}
function within7(v){if(!v)return false;const d=parseDate(v)-Date.now();return d>=-86400000&&d<=7*86400000}
function matches(j){const r=getRec(j.id),text=[j.org,j.region,j.role,j.note,r.note].join(' ').toLowerCase();return(!query||text.includes(query.toLowerCase()))&&(type==='all'||j.category===type)&&(!coreOnly||j.core)&&(!nextOnly||within7(r.nextAt))}
function sortJobs(a,b,g){const ar=getRec(a.id),br=getRec(b.id);if(g.id==='wait'){const ad=deadlineValue(a.deadline),bd=deadlineValue(b.deadline);if(ad!==bd)return ad-bd}else{const an=parseDate(ar.nextAt),bn=parseDate(br.nextAt);if(an!==bn)return an-bn;const al=parseDate(ar.latestAt),bl=parseDate(br.latestAt);if(al!==bl)return bl-al}if(!!a.core!==!!b.core)return a.core?-1:1;const od=String(a.org||'').localeCompare(String(b.org||''),'zh-CN');if(od)return od;return String(a.role||'').localeCompare(String(b.role||''),'zh-CN')}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function jobCard(j){const r=getRec(j.id),c=el('div','job-card'+(j.core?' core':'')),top=el('div','card-top'),role=el('div','role',j.role||'未填写岗位'),tag=el('span','tag'+(j._userEdited?' custom':''),j._userEdited?(j._userSource==='custom'?'自建':'已改'):(j.category||'岗位'));top.append(role,tag);c.appendChild(top);const meta=el('div','meta',[j.region,j.level,j.deadline&&`截止 ${j.deadline}`].filter(Boolean).join(' · '));c.appendChild(meta);if(r.nextAt)c.appendChild(el('div','next',`下一节点：${r.nextAt}${within7(r.nextAt)?'（7天内）':''}`));if(r.note)c.appendChild(el('div','note',r.note));const actions=el('div','actions'),sel=document.createElement('select');STATUSES.forEach(s=>sel.add(new Option(s,s)));sel.value=r.status;sel.onchange=()=>{setRec(j.id,{...getRec(j.id),status:sel.value,latestAt:''});render()};const detail=el('button','','详情');detail.onclick=()=>openModal(j);actions.append(sel,detail);c.appendChild(actions);return c}
function appendOrgGroups(container,list){const grouped=new Map();list.forEach(j=>{const key=(j.org||'未命名机构').trim()||'未命名机构';if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(j)});grouped.forEach((items,org)=>{const group=el('section','org-group'+(items.some(j=>j.core)?' core':'')),head=el('div','org-head'),name=el('div','org-name',org),count=el('span','org-count',`${items.length} 个岗位`),body=el('div','org-jobs');head.append(name,count);group.append(head,body);items.forEach(j=>body.appendChild(jobCard(j)));container.appendChild(group)})}
function render(){jobs=QIUZHAO_USER_JOBS.apply([...map.values()]);const board=document.getElementById('board');board.innerHTML='';const counts={wait:0,sent:0,test:0,interview:0,offer:0,closed:0};GROUPS.forEach(g=>{const col=el('section','column'),head=el('div','column-head'),title=el('div','column-title',g.title),count=el('span','column-count'),groups=el('div','org-groups');head.append(title,count);col.append(head,groups);const allInStage=jobs.filter(j=>g.statuses.includes(getRec(j.id).status)),list=allInStage.filter(matches).sort((a,b)=>sortJobs(a,b,g));counts[g.id]=allInStage.length;const orgCount=new Set(list.map(j=>(j.org||'未命名机构').trim())).size;count.textContent=`${orgCount}机构 · ${list.length}岗`;if(!list.length)groups.appendChild(el('div','empty','暂无岗位'));else appendOrgGroups(groups,list);board.appendChild(col)});sWait.textContent=counts.wait;sSent.textContent=counts.sent;sTest.textContent=counts.test;sInterview.textContent=counts.interview;sOffer.textContent=counts.offer;sClosed.textContent=counts.closed}
function field(grid,label,type='text',full=false){const w=el('div','field'+(full?' full':'')),l=el('label','',label),x=type==='textarea'?document.createElement('textarea'):type==='select'?document.createElement('select'):document.createElement('input');if(type!=='textarea'&&type!=='select')x.type=type;w.append(l,x);grid.appendChild(w);return x}
function openModal(j){const r=getRec(j.id),bg=el('div','modal-bg'),m=el('div','modal'),head=el('div','modal-head'),ht=el('div'),h=el('h2','',j.org||'岗位'),sub=el('div','modal-sub',[j.role,j.region].filter(Boolean).join(' · ')),close=el('button','close','关闭');ht.append(h,sub);head.append(ht,close);m.appendChild(head);bg.appendChild(m);document.body.appendChild(bg);close.onclick=()=>bg.remove();bg.onclick=e=>{if(e.target===bg)bg.remove()};const grid=el('div','form');m.appendChild(grid);const status=field(grid,'当前进展','select');STATUSES.forEach(s=>status.add(new Option(s,s)));status.value=r.status;const applied=field(grid,'投递日期','date'),latest=field(grid,'最新进展日期','date'),next=field(grid,'下一节点日期','date'),note=field(grid,'结果 / 进展备注','textarea',true);applied.value=r.appliedAt||'';latest.value=r.latestAt||'';next.value=r.nextAt||'';note.value=r.note||'';if(r.history?.length){const hw=el('div','field full'),lab=el('label','','状态历史'),hist=el('div','history');r.history.forEach(x=>{const row=el('div','hist'),a=el('b','',x.status),d=el('span','',x.at||x.source||'历史记录');row.append(a,d);hist.appendChild(row)});hw.append(lab,hist);grid.appendChild(hw)}const acts=el('div','modal-actions'),left=el('div'),right=el('div'),clear=el('button','danger','清除进展'),cancel=el('button','','取消'),save=el('button','save','保存');left.append(clear);right.append(cancel,save);acts.append(left,right);m.appendChild(acts);cancel.onclick=()=>bg.remove();clear.onclick=()=>{if(confirm('确定清除这个岗位的投递进展吗？')){clearRec(j.id);bg.remove();render()}};save.onclick=()=>{setRec(j.id,{status:status.value,appliedAt:applied.value,latestAt:latest.value,nextAt:next.value,note:note.value.trim()});bg.remove();render()}}
search.oninput=e=>{query=e.target.value;render()};typeFilter.onchange=e=>{type=e.target.value;render()};coreBtn.onclick=e=>{coreOnly=!coreOnly;e.currentTarget.classList.toggle('active',coreOnly);render()};nextBtn.onclick=e=>{nextOnly=!nextOnly;e.currentTarget.classList.toggle('active',nextOnly);render()};
migrateLegacy();render();
</script>
</body>
</html>
