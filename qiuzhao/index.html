<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027 秋招投递总表</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#18212b;--muted:#66727e;--line:#e4e8ed;--blue:#102a43;--teal:#126e75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.wrap{max-width:1380px;margin:auto;padding:24px 16px 56px}.hero{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;border-radius:22px;padding:24px 26px;box-shadow:0 12px 32px rgba(16,42,67,.16)}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;opacity:.84;line-height:1.65}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.13);padding:12px 14px;border-radius:13px}.stat b{font-size:23px;display:block}.progress{height:9px;background:rgba(255,255,255,.18);border-radius:9px;margin-top:14px;overflow:hidden}.progress span{display:block;height:100%;background:#fff;width:0}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 12px}button,input,select{font:inherit}button,.search,.sortselect{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px}button{cursor:pointer}button.active{background:#18212b;color:#fff;border-color:#18212b}.search{min-width:260px;flex:1}.sortselect{min-width:205px}.sortstatus{display:flex;align-items:center;padding:0 4px;color:#49606f;font-size:13px;font-weight:700}.notice{background:#fff7e8;border:1px solid #f2dda9;border-radius:13px;padding:12px 14px;margin:10px 0 16px;color:#684f18;line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 25px rgba(16,24,40,.06)}table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:#f8fafb;color:var(--muted);font-size:12px;text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);z-index:2}th.sortable{cursor:pointer;user-select:none;white-space:nowrap}th.sortable:hover{background:#eef3f6;color:#293846}.sort-arrow{display:inline-block;min-width:14px;margin-left:4px;color:#2d6f8f;font-weight:900}td{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}tr:last-child td{border-bottom:none}tr.done{opacity:.53;background:#fafafa}tr.done .role{text-decoration:line-through}.check{width:21px;height:21px;accent-color:#11815e;cursor:pointer}.org{font-weight:800;white-space:nowrap}.role{font-weight:700;line-height:1.4}.small{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:750;white-space:nowrap}.bank{background:#eaf3ff;color:#225a92}.soe{background:#eef8f2;color:#246b4e}.core{background:#1b6f5d;color:#fff;margin-left:5px}.lv-sprint{background:#fff0ef;color:#a6362f}.lv-main{background:#edf4ff;color:#245a9a}.lv-safe{background:#edf8f2;color:#256b4f}.lv-expand{background:#f3f4f6;color:#4b5563}.deadline{font-weight:700}.unknown{color:#8a5c00}.apply{display:inline-block;background:#18212b;color:#fff;text-decoration:none;padding:8px 11px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap}.copy{border:none;background:#eef2f5;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer;margin-left:6px}.footer{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}@media(max-width:860px){.wrap{padding:12px 8px 36px}.hero{border-radius:16px;padding:18px}.hero h1{font-size:23px}.stats{grid-template-columns:1fr 1fr}.card{overflow-x:auto}table{min-width:1200px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>2027 秋招投递总表</h1><p>银行 + 非银行国央企。支持打勾、筛选、搜索、表头排序、复制岗位关键词和官网直达。</p><div class="stats"><div class="stat"><b id="done">0</b><span>已投</span></div><div class="stat"><b id="total">0</b><span>全部目标</span></div><div class="stat"><b id="coreRemain">0</b><span>核心未投</span></div><div class="stat"><b id="soeCount">0</b><span>国央企岗位</span></div></div><div class="progress"><span id="bar"></span></div></section>
<div class="toolbar"><button class="active" data-mode="all">全部</button><button data-mode="undone">只看未投</button><button data-mode="core">只看核心</button><button data-mode="bank">只看银行</button><button data-mode="soe">只看国央企</button><input id="search" class="search" placeholder="搜索：单位 / 地区 / 岗位 / 关键词"><select id="sortSelect" class="sortselect"><option value="deadline:1">截止：最早优先</option><option value="deadline:-1">截止：最晚优先</option><option value="level:1">档位：主投→冲刺→稳妥→扩充</option><option value="level:-1">档位：扩充→稳妥→冲刺→主投</option><option value="org:1">单位：升序</option><option value="org:-1">单位：降序</option><option value="region:1">地区：升序</option><option value="region:-1">地区：降序</option><option value="role:1">岗位：升序</option><option value="role:-1">岗位：降序</option></select><span id="sortStatus" class="sortstatus"></span><button id="exportBtn">导出勾选</button><button id="importBtn">导入勾选</button><input id="importFile" type="file" accept="application/json" hidden><button id="reset">清空勾选</button></div>
<div class="notice"><b>统一档位：</b><b>主投</b>＝与你背景和岗位价值都较匹配，优先投入；<b>冲刺</b>＝值得投但竞争或门槛更高；<b>稳妥</b>＝匹配较好、风险相对可控；<b>扩充</b>＝用于扩大机会池。原来的 S+/S/A+/A/A-/B+/B 等评级已在页面中统一转换，不再混用。</div>
<div class="card"><table><thead><tr><th style="width:52px">已投</th><th>类型</th><th class="sortable" data-sort="org">单位<span class="sort-arrow"></span></th><th class="sortable" data-sort="region">地区<span class="sort-arrow"></span></th><th class="sortable" data-sort="role">目标岗位<span class="sort-arrow"></span></th><th class="sortable" data-sort="level">档位<span class="sort-arrow"></span></th><th class="sortable" data-sort="deadline">截止<span class="sort-arrow"></span></th><th>官网</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="footer">排序选择会保存在当前浏览器，刷新页面后仍保持。当前排序仅影响显示顺序，不影响勾选记录。</div>
</div>
<script src="./data.js"></script>
<script>
const jobs=window.JOBS||[];const KEY='autumn-2027-all-jobs-v3',SORTKEY='autumn-2027-sort-v2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let mode='all',q='';
let savedSort=JSON.parse(localStorage.getItem(SORTKEY)||'null');let sortKey=savedSort?.key||'deadline',sortDir=savedSort?.dir||1;
const collator=new Intl.Collator('zh-CN',{numeric:true,sensitivity:'base'});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const levelOverrides={
'cnpc-eri-energy':'主投','cnpc-intl-trade':'主投','cnpc-liaohe-mgmt':'稳妥','sinopec-south-sales':'主投','cssc-gsi-business':'主投','cnpc-hubei-retail':'主投','cnpc-chongqing-plan':'主投','cnpc-east-trade':'主投','cnodc-business':'冲刺','cosco-special-ops':'主投','sinomach-trade':'主投','cscec1-invest':'主投','cscec1-operation':'稳妥','cscec2-invest':'稳妥','cssc-gsi-mgmt':'稳妥','cosco-fuel':'稳妥','cosco-mgmt':'稳妥','sinopec-4-intl':'稳妥','sinopec-north-mgmt':'扩充','huaneng-econ':'扩充','cgn-newenergy':'主投','dongfeng-business':'扩充','sinopec-zhongyuan':'扩充','sinopec-nw':'扩充','cmcc-beijing':'扩充','cmcc-internet':'扩充','unicom-liaoning':'扩充','chnenergy-industry':'冲刺','cnooc-pool':'主投','huadian-regular':'扩充','datang-regular':'扩充'};
function normalizedLevel(j){if(levelOverrides[j.id])return levelOverrides[j.id];if(['主投','冲刺','稳妥','扩充'].includes(j.level))return j.level;const generic={'S+':'主投','S':'主投','A+':'主投','A':'稳妥','A-':'扩充','B+':'扩充','B':'扩充','待筛':'扩充'};return generic[j.level]||'扩充'}
function levelClass(j){const x=normalizedLevel(j);return x==='主投'?'lv-main':x==='冲刺'?'lv-sprint':x==='稳妥'?'lv-safe':'lv-expand'}function levelRank(j){return {'主投':1,'冲刺':2,'稳妥':3,'扩充':4}[normalizedLevel(j)]||9}
function deadlineValue(text){const s=String(text||'').trim();if(/待核实|未公开|非官方|第三方/.test(s))return{known:false,value:0};let m=s.match(/^(\d{1,2})\s*[\/月]\s*(\d{1,2})(?:\s*日)?(?:\s+(\d{1,2})\s*[:：]\s*(\d{2}))?/);if(m){const mo=+m[1],d=+m[2];if(m[3]!==undefined){let h=+m[3],mi=+m[4];if(h===24)return{known:true,value:new Date(2026,mo-1,d+1,0,mi,0,0).getTime()};return{known:true,value:new Date(2026,mo-1,d,h,mi,0,0).getTime()}}return{known:true,value:new Date(2026,mo-1,d,23,59,59,999).getTime()}}m=s.match(/^(\d{1,2})月(上旬|中旬|下旬)/);if(m){const d=m[2]==='上旬'?5:m[2]==='中旬'?15:25;return{known:true,value:new Date(2026,+m[1]-1,d,23,59,59,999).getTime()}}return{known:false,value:0}}
function compareJobs(a,b){if(sortKey==='deadline'){const av=deadlineValue(a.deadline),bv=deadlineValue(b.deadline);if(av.known!==bv.known)return av.known?-1:1;if(!av.known&&!bv.known)return collator.compare(a.deadline||'',b.deadline||'');const diff=(av.value-bv.value)*sortDir;return diff||collator.compare(a.org||'',b.org||'')}if(sortKey==='level'){const d=(levelRank(a)-levelRank(b))*sortDir;return d||collator.compare(a.org||'',b.org||'')}return collator.compare(a[sortKey]||'',b[sortKey]||'')*sortDir}
function match(j){const text=[j.category,j.org,j.region,j.role,normalizedLevel(j),j.keyword,j.note].join(' ').toLowerCase(),query=q.trim().toLowerCase();const ok=mode==='all'||(mode==='undone'&&!state[j.id])||(mode==='core'&&j.core)||(mode==='bank'&&j.category==='银行')||(mode==='soe'&&j.category==='国央企');return ok&&(!query||text.includes(query))}
function sortLabel(){const names={deadline:'截止',org:'单位',region:'地区',role:'岗位',level:'档位'};return `当前：${names[sortKey]} ${sortDir===1?'↑':'↓'}`}
function updateSortUI(){document.querySelectorAll('th.sortable').forEach(th=>{const a=th.querySelector('.sort-arrow');a.textContent=th.dataset.sort===sortKey?(sortDir===1?'▲':'▼'):'↕'});document.getElementById('sortSelect').value=`${sortKey}:${sortDir}`;document.getElementById('sortStatus').textContent=sortLabel();localStorage.setItem(SORTKEY,JSON.stringify({key:sortKey,dir:sortDir}))}
function render(){const body=document.getElementById('body');body.innerHTML='';const visible=jobs.filter(match).slice().sort(compareJobs);visible.forEach(j=>{const tr=document.createElement('tr');if(state[j.id])tr.className='done';const unknown=!deadlineValue(j.deadline).known;const lvl=normalizedLevel(j);tr.innerHTML=`<td><input class="check" type="checkbox" ${state[j.id]?'checked':''}></td><td><span class="badge ${j.category==='银行'?'bank':'soe'}">${esc(j.category)}</span></td><td><div class="org">${esc(j.org)}${j.core?'<span class="badge core">核心</span>':''}</div></td><td>${esc(j.region)}</td><td><div class="role">${esc(j.role)}</div><div class="small">搜索：${esc(j.keyword)} <button class="copy">复制关键词</button></div><div class="small">${esc(j.note)}</div></td><td><span class="badge ${levelClass(j)}">${esc(lvl)}</span></td><td><span class="deadline ${unknown?'unknown':''}">${esc(j.deadline)}</span></td><td><a class="apply" href="${j.url}" target="_blank" rel="noopener">去官网 ↗</a></td>`;tr.querySelector('.check').onchange=e=>{state[j.id]=e.target.checked;localStorage.setItem(KEY,JSON.stringify(state));render()};tr.querySelector('.copy').onclick=e=>{navigator.clipboard.writeText(j.keyword);e.target.textContent='已复制';setTimeout(()=>e.target.textContent='复制关键词',800)};body.appendChild(tr)});const done=jobs.filter(j=>state[j.id]).length;doneEl.textContent=done;total.textContent=jobs.length;coreRemain.textContent=jobs.filter(j=>j.core&&!state[j.id]).length;soeCount.textContent=jobs.filter(j=>j.category==='国央企').length;bar.style.width=(jobs.length?Math.round(done/jobs.length*100):0)+'%';updateSortUI()}
const doneEl=document.getElementById('done'),total=document.getElementById('total'),coreRemain=document.getElementById('coreRemain'),soeCount=document.getElementById('soeCount'),bar=document.getElementById('bar');
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()});document.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1}render()});document.getElementById('sortSelect').onchange=e=>{const[k,d]=e.target.value.split(':');sortKey=k;sortDir=Number(d);render()};document.getElementById('search').oninput=e=>{q=e.target.value;render()};document.getElementById('reset').onclick=()=>{if(confirm('确定清空所有勾选吗？')){state={};localStorage.setItem(KEY,'{}');render()}};document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='2027秋招投递进度.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);localStorage.setItem(KEY,JSON.stringify(state));render()}catch{alert('导入文件格式不正确')}};r.readAsText(f)};render();
</script>
</body></html>
