name: Fast deploy qiuzhao Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qiuzhao/**'
      - '.github/workflows/qiuzhao-pages.yml'

concurrency:
  group: xuandiao-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html data.json review_queue.json third_sources.json monitor_status.json _site/
          cp -r qiuzhao _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
