name: Monitor announcements and publish site

on:
  schedule:
    # Every 3 hours at :17 China Standard Time: 02:17, 05:17, 08:17, 11:17, 14:17, 17:17, 20:17, 23:17. GitHub can delay scheduled runs.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: xuandiao-pages
  # A newer human/scheduled run may replace an older one, but a bot write-back
  # must never cancel the run that is about to deploy that same write-back.
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  monitor-and-publish:
    # Bot commits contain monitoring results from the current run. Do not start a
    # second full workflow for those commits; this prevents duplicate deployments.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner libraries
        run: pip install -r requirements.txt
      - name: Apply final repository audit fixes
        run: python final_audit_patch.py
      - name: Normalize and validate repository data
        run: |
          python data_hygiene.py
          python build.py
          python build.py --check
          python validate_extra.py
          python -m unittest discover -s tests
      - name: Check government and JLU backup pages plus 31 regional queries
        run: python monitor.py
      - name: Auto-publish, normalize and enrich notices
        run: |
          python jlu_auto_publish.py
          python jlu_timing_fix.py
          python data_hygiene.py
          python build.py
          python build.py --check
          python validate_extra.py
      - name: Save audit fixes, monitoring results and published notices
        run: |
          git config user.name 'xuandiao-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: apply final audit fixes and refresh monitoring data'
            git push origin HEAD:main
          fi
      - name: Open one GitHub issue for newly detected candidates still requiring review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(cat new_candidate_count.txt)" -gt 0 ]; then
            gh issue create --title "选调雷达：$(cat new_candidate_count.txt) 条新公告线索待核验" --body-file monitor_report.md || echo 'Issue creation unavailable: inspect review_queue.json manually.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html data.json review_queue.json third_sources.json monitor_status.json _site/
          cp -r qiuzhao _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
