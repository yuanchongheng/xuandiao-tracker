name: Monitor announcements and publish site

on:
  schedule:
    # Every 3 hours at :17 China Standard Time: 02:17, 05:17, 08:17, 11:17, 14:17, 17:17, 20:17, 23:17. GitHub can delay scheduled runs.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: xuandiao-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner libraries
        run: pip install -r requirements.txt
      - name: Validate verified data and offline snapshot
        run: python build.py --check
      - name: Run offline regression tests
        run: python -m unittest discover -s tests
      - name: Check government and JLU backup pages plus 31 regional queries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        run: python monitor.py
      - name: Auto-publish JLU employment notices
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          root = Path('.')
          queue_path = root / 'review_queue.json'
          data_path = root / 'data.json'
          status_path = root / 'monitor_status.json'
          queue_doc = json.loads(queue_path.read_text(encoding='utf-8'))
          data = json.loads(data_path.read_text(encoding='utf-8'))
          status = json.loads(status_path.read_text(encoding='utf-8')) if status_path.exists() else {}
          records = data.setdefault('records', [])
          queue = queue_doc.setdefault('candidates', [])
          jlu_hosts = ('jdjywpt.jlu.edu.cn', 'jdjyw.jlu.edu.cn')
          now = datetime.now(timezone(timedelta(hours=8))).isoformat(timespec='seconds')

          def clean(s):
              return re.sub(r'[\u200b\ufeff]', '', str(s or '')).strip()

          def norm(s):
              return re.sub(r'[\s·•—–_()（）\[\]【】《》“”‘’：:，,。.!！?？/\\-]+', '', clean(s)).removesuffix('公告')

          def is_jlu(url):
              return any(url.startswith('https://' + host + '/') for host in jlu_hosts)

          existing_urls = {r.get('source') for r in records if r.get('source')}
          existing_keys = {(r.get('province'), norm(r.get('title'))) for r in records}
          promoted = 0
          covered = 0

          for c in queue:
              if c.get('status') != 'pending' or not is_jlu(c.get('url', '')):
                  continue
              key = (c.get('province'), norm(c.get('title')))
              if c.get('url') in existing_urls or key in existing_keys:
                  c['status'] = 'auto_covered'
                  c['note'] = '吉林大学就业网来源；正式数据中已有同链接或同标题记录，无需人工二次核验。'
                  covered += 1
                  continue
              discovered = c.get('discovered') or now
              day = discovered[:10]
              title = clean(c.get('title'))
              records.append({
                  'province': c.get('province'),
                  'title': title,
                  'type': '定向选调' if '定向选调' in title else ('选调公告' if '选调' in title else '招聘通知'),
                  'count': '以吉林大学就业网公告及附件为准',
                  'published': day,
                  'start': '',
                  'end': '',
                  'exam': '',
                  'examEnd': '',
                  'examText': '报名、笔试及后续安排以吉林大学就业网原文和附件为准',
                  'school': '吉林大学就业网已发布该通知；适用高校、学历、专业及校内流程以原文和附件为准。',
                  'eligibility': '自动收录不推断资格条件；请直接查看吉林大学就业网原文及附件。',
                  'notes': '吉林大学就业网自动发布，无需人工二次核验。published 字段暂用系统发现日期，仅用于数据完整性和排序，不代表公告原始发布时间；报名、考试、岗位差异等未结构化内容一律以原文及附件为准。',
                  'source': c.get('url'),
                  'sourceName': '吉林大学就业网（自动发布）',
                  'sourceType': '吉林大学备用',
                  'verified': day,
                  'sourceTier': 'jlu_fallback',
                  'autoPublished': True,
                  'publishedEstimated': True,
                  'discoveredAt': discovered
              })
              existing_urls.add(c.get('url'))
              existing_keys.add(key)
              c['status'] = 'auto_published'
              c['note'] = '吉林大学就业网来源；已按自动发布规则加入正式 data.json，无需人工二次核验。具体条件和时间仍以原文及附件为准。'
              promoted += 1

          if promoted:
              data['asOf'] = now
              data['notice'] = '来源按政府官网、吉林大学就业网、经批准的其他高校官方就业网三级查找。吉林大学就业网发现的2027届选调通知自动进入正式数据，无需人工二次核验；自动入库不猜测报名、考试或资格字段，未结构化内容以原文和附件为准。政府来源候选和其他高校第三来源仍按原规则处理。'
          queue_doc['updated'] = now
          status['pendingCandidates'] = sum(c.get('status') == 'pending' for c in queue)
          status['jluAutoPublishedThisRun'] = promoted
          status['jluAutoCoveredThisRun'] = covered
          status['warning'] = '吉林大学就业网线索会自动进入正式数据；政府来源候选仍需人工核验，第三来源仅供参考。自动入库不推断未明确的报名、考试或资格字段。'
          checked = status.get('checkedAt')
          remaining_new = sum(c.get('status') == 'pending' and (not checked or c.get('discovered') == checked) for c in queue)
          queue_path.write_text(json.dumps(queue_doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          data_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (root / 'new_candidate_count.txt').write_text(str(remaining_new), encoding='utf-8')
          print(f'JLU auto-publish: promoted={promoted}, covered={covered}, pending={status["pendingCandidates"]}')
          PY
          python build.py
          python build.py --check
      - name: Save check results and formal JLU auto-published notices
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        run: |
          git config user.name 'xuandiao-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add watch_state.json review_queue.json third_sources.json monitor_status.json data.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update monitoring and auto-publish JLU notices'
            git push origin HEAD:main
          fi
      - name: Open one GitHub issue for newly detected candidates still requiring review
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(cat new_candidate_count.txt)" -gt 0 ]; then
            gh issue create --title "选调雷达：$(cat new_candidate_count.txt) 条新公告线索待核验" --body-file monitor_report.md || echo 'Issue creation unavailable: inspect review_queue.json manually.'
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html data.json review_queue.json third_sources.json monitor_status.json _site/
          cp -r qiuzhao _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
