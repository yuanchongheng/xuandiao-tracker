name: Monitor announcements and publish site

on:
  schedule:
    # Every 3 hours at :17 China Standard Time: 02:17, 05:17, 08:17, 11:17, 14:17, 17:17, 20:17, 23:17. GitHub can delay scheduled runs.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: xuandiao-pages
  cancel-in-progress: ${{ github.actor != 'github-actions[bot]' }}

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  monitor-and-publish:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner libraries
        run: pip install -r requirements.txt
      - name: Apply manual 2026-10-09 refresh
        run: python manual_refresh_20261009.py
      - name: Normalize and validate repository data
        run: |
          python data_hygiene.py
          python build.py
          python build.py --check
          python validate_extra.py
          python -m unittest discover -s tests
      - name: Save manual refresh
        run: |
          git config user.name 'xuandiao-monitor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json index.html
          if ! git diff --cached --quiet; then
            git commit -m 'chore: manual refresh Zhejiang and Shandong selection notices'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site
          cp index.html data.json review_queue.json third_sources.json monitor_status.json _site/
          cp -r qiuzhao _site/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
